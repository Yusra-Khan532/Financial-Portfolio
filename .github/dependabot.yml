version: 2
updates:
  - package-ecosystem: pip
    directory: /finlit-platform/backend
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: pip          # the company site backend (its own pinned versions, its own virtual environment in the image)
    directory: /finlit-platform/site-api/backend
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: npm          # the website. xlsx comes from SheetJS's own server (the npm registry copy is old and vulnerable),
    directory: /finlit-platform/frontend            # so Dependabot cannot update it: check https://cdn.sheetjs.com for new versions by hand.
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: xlsx
      # Node's types follow the Node the site runs on (22, in the Dockerfile and CI); a new major comes with a planned move of the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: docker       # the AWS application image
    directory: /finlit-platform
    schedule: {interval: weekly}
    ignore:
      # The website is built on Node 22 (LTS until April 2027), the same version CI tests; moving to a new major is a planned change, not a weekly bump.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /finlit-platform/backend
    schedule: {interval: weekly}
