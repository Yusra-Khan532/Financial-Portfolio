name: platform-image

# Builds the server image (finlit-platform/Dockerfile) for every commit on main and publishes it as ghcr.io/yusra-khan532/finlit-app:<commit>.
# The server's deploy (finlit-platform/deploy/aws/deploy.sh, pull_prebuilt) downloads it instead of building on its own 2 GB of memory, and builds
# itself only when this image does not come. The repository is public, so the image is public too: it holds only what the repository holds
# (.dockerignore keeps any env file out), and the server needs no login to pull it.
on:
  push:
    branches: [main]
    paths: ["finlit-platform/**", ".github/workflows/platform-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: platform-image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: commit
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: finlit-platform
          file: finlit-platform/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: GIT_COMMIT=${{ steps.commit.outputs.short }}
          labels: finlit.commit=${{ steps.commit.outputs.short }}
          tags: |
            ghcr.io/yusra-khan532/finlit-app:${{ github.sha }}
            ghcr.io/yusra-khan532/finlit-app:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
