name: Smoke test the live site
# Read-only checks against the AWS site (finlit-platform/scripts/smoke.sh): every six hours, and on demand.
# The address is https://finlitventures.com unless the repository variable FINLIT_SITE_URL names another one.
# (Until 17 Nov 2026 the scheduled run skipped itself whenever that variable was not set, and it never was, so the schedule never ran.)
on:
  schedule: [{cron: "17 */6 * * *"}]
  workflow_dispatch:
    inputs:
      base_url:
        description: Site address to test (empty = https://finlitventures.com)
        required: false
        default: ""
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: bash finlit-platform/scripts/smoke.sh "$BASE_URL"
        env:
          BASE_URL: ${{ inputs.base_url || vars.FINLIT_SITE_URL || 'https://finlitventures.com' }}
