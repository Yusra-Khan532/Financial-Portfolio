name: Website
on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env: {VITE_API_BASE: "${{ vars.VITE_API_BASE }}"}
      - uses: actions/upload-artifact@v4
        with: {name: site, path: frontend/dist, retention-days: 7}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    permissions: {contents: read, deployments: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: site, path: dist}
      - name: Deploy to Cloudflare Pages
        # Runs only once the Cloudflare secrets exist (see docs/LAUNCH-RUNBOOK.md).
        if: ${{ env.CF_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        env: {CF_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=finlit --branch=main
