name: Keep the free server awake
# A free Render service sleeps after 15 minutes without traffic (about a minute to wake) and sleeping pauses the background jobs.
# This pings it every 10 minutes. Set the repository variable SITE_URL (Settings -> Secrets and variables -> Actions -> Variables)
# to the service address, e.g. https://finlit.onrender.com . Without it nothing runs. /api/ping never touches the database.
# GitHub runs scheduled jobs on a best-effort basis (delays of a few minutes are normal): add an UptimeRobot monitor as a backup (docs/deploy-free.md).
on:
  schedule: [{cron: "*/10 * * * *"}]
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - run: '[ -z "$SITE_URL" ] || curl -fsS --retry 3 --max-time 90 "$SITE_URL/api/ping"'
