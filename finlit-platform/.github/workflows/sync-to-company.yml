# Delivers this repository's new work to the company repository (Yusra-Khan532/Financial-Portfolio, folder finlit-platform/) by itself:
# it runs scripts/sync-to-company.sh --push and opens the pull request. Merging that pull request stays a person's click; the server then
# deploys main automatically. One-time setup: add the repository secret COMPANY_REPO_TOKEN (a GitHub token with write access to the company
# repository; Settings > Secrets and variables > Actions). The token is only ever used here and is never printed.
name: Sync to company repo
on:
  push:
    branches: [claude/brave-mayer-fkr9oj]
  workflow_dispatch:
concurrency:
  group: sync-to-company
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[skip sync]') }}
    runs-on: ubuntu-latest
    env:
      COMPANY: Yusra-Khan532/Financial-Portfolio
      TOKEN: ${{ secrets.COMPANY_REPO_TOKEN }}
    steps:
      - name: The token must exist
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::The secret COMPANY_REPO_TOKEN is not set (see the comment at the top of this file)."; exit 1; fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync and push the branch
        id: sync
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global user.name "Pranshu Mishra"
          git config --global user.email "pranshu@users.noreply.github.com"
          sha="$(git rev-parse --short HEAD)"
          out="$(bash scripts/sync-to-company.sh --push 2>&1)" || { echo "$out" | sed "s#${TOKEN}#***#g"; exit 1; }
          echo "$out" | sed "s#${TOKEN}#***#g"
          if echo "$out" | grep -q "Nothing new"; then echo "pushed=no" >> "$GITHUB_OUTPUT"; else echo "pushed=yes" >> "$GITHUB_OUTPUT"; echo "branch=pranshu-sync-$sha" >> "$GITHUB_OUTPUT"; fi
      - name: Open the pull request
        if: steps.sync.outputs.pushed == 'yes'
        run: |
          branch="${{ steps.sync.outputs.branch }}"
          existing="$(curl -fsS -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/$COMPANY/pulls?head=${COMPANY%%/*}:$branch&state=open" | python3 -c 'import sys,json;print(len(json.load(sys.stdin)))')"
          if [ "$existing" != "0" ]; then echo "A pull request for $branch is already open."; exit 0; fi
          body="$(printf 'Automatic delivery from pranshukesavmishra/finlit-platform (%s).\n\nMerge with "Create a merge commit"; the server deploys main by itself within about 10 minutes.' "$branch")"
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$COMPANY/pulls" \
            -d "$(python3 -c 'import json,sys;print(json.dumps({"title":"Sync finlit-platform/ with pranshukesavmishra/finlit-platform ("+sys.argv[1]+")","head":sys.argv[1],"base":"main","body":sys.argv[2]}))' "$branch" "$body")" \
            | python3 -c 'import sys,json;print("Opened:", json.load(sys.stdin).get("html_url"))'
