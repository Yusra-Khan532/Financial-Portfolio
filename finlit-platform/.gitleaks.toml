# Only deliberate, publicly-known dummy values are allowed: the RFC 6238 test vector, development-only placeholders and
# the fixed test passphrase. Real keys must never be committed; everything else is still scanned.
[extend]
useDefault = true

[[allowlists]]
description = "dummy values used by tests and local development"
paths = [
  '''backend/tests/''',
  '''frontend/e2e/''',
  '''dev/site_api_dev\.py''',
  '''backend/finlit/config\.py''',
]
regexes = [
  '''GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ''',
  '''dev-only-secret-key-do-not-use-in-production''',
  '''a-long-unusual-phrase-42''',
]

# The id of an info tooltip ({ key: "forecast-215", label: "Forecast", what: ... }) is a page name, not a secret: the generic rule read
# key: "forecast-215" as an API key (task #215, 18 Nov 2026; the owner chose this narrow rule). Only a key followed by its label on the same line.
[[allowlists]]
description = "info tooltip ids: key: \"<id>\", label: ..."
regexTarget = "line"
regexes = ['''\bkey: "[a-z0-9][a-z0-9-]{0,40}", label: "''']
