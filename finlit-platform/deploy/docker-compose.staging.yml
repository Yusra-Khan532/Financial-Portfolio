# Staging override: replaces the tunnel with public HTTPS on a sslip.io hostname.
#   docker compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.staging.yml --env-file .env up -d
# .env additions:  API_HOST=203-0-113-5.sslip.io   ACME_EMAIL=you@company.com
#                  and set ALLOWED_HOSTS / CORS_ORIGINS to your API_HOST and https://finlit.pages.dev
services:
  caddy:
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    environment: {API_HOST: "${API_HOST:?}", ACME_EMAIL: "${ACME_EMAIL:?}"}
  cloudflared:
    profiles: ["tunnel"]
  research-api:
    environment:
      ALLOWED_HOSTS: ${API_HOST},research-api,localhost
      CORS_ORIGINS: ${STAGING_ORIGIN:-https://finlit.pages.dev}
      PUBLIC_SITE_URL: ${STAGING_ORIGIN:-https://finlit.pages.dev}
      COOKIE_SAMESITE: none   # pages.dev and sslip.io are different sites; remove once finlitventures.com is connected
  site-api:
    environment:
      ALLOWED_HOSTS: ${API_HOST},site-api,localhost
      CORS_ORIGINS: ${STAGING_ORIGIN:-https://finlit.pages.dev}
volumes:
  caddydata: {}
