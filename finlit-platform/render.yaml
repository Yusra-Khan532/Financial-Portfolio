# Free, one-click deployment on Render (https://render.com): the whole site in ONE web service.
#   finlit   website + research API + the company's site backend (blog/CMS, portfolio, forms, chat) + background jobs
#   finlit-redis   free Redis (cache only; it may be emptied at any restart and refills itself)
# Two things are created by hand, because Render's free Postgres is deleted after 30 days and Render has no free MongoDB:
#   DATABASE_URL  a free Neon Postgres (https://neon.tech)        MONGO_URL  a free MongoDB Atlas M0 cluster
# Steps with exact clicks: docs/LAUNCH-GUIDE.md. Render dashboard -> New -> Blueprint -> pick this repository.
# Nothing secret is stored in the repository; values marked sync:false are typed into the Render dashboard.
# After it is live, read DEMO_PASSWORD under the service's Environment tab: it is the password of the demo accounts
#   demo-basic@finlit-demo.com, demo-silver@finlit-demo.com, demo-gold@finlit-demo.com
services:
  - type: web
    name: finlit
    runtime: docker
    plan: free              # about 750 free instance hours a month per Render workspace: enough for ONE always-on service (hence one container)
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/ping   # never touches the database, so health checks cannot keep Neon awake
    envVars:
      - {key: ENVIRONMENT, value: staging}      # not "production" yet: production refuses to start without Resend email (MAIL_MODE=resend, RESEND_API_KEY), a fixed ALLOWED_HOSTS and AUTO_VERIFY_EMAIL off; API docs and health internals are already hidden here
      - {key: AUTO_VERIFY_EMAIL, value: "1"}    # staging: no mail service yet, so new accounts are confirmed at sign-up (refused in production)
      - {key: FINEDGE_MODE, value: live}
      - {key: FINEDGE_API_KEY, sync: false}     # FinEdge market data
      - {key: DATABASE_URL, sync: false}        # Neon connection string (direct, not "-pooler"); see docs/LAUNCH-GUIDE.md
      - {key: MONGO_URL, sync: false}           # MongoDB Atlas connection string, for the blog / portfolio / forms
      - {key: DB_NAME, value: finlit}
      # FinLit Prism (Gold plan's financial-health rating) runs in the site backend, which starts with MONGO_URL or, without it, with
      # FINEDGE_API_KEY + CMS_JWT_SECRET. Setup checklist: docs/prism/DEPLOY.md
      - {key: UPSTOX_ACCESS_TOKEN, sync: false}        # optional: second data source for gaps in the provider's statements (expires daily; Prism works without it)
      - {key: PREMIUM_GENERATION_SLOTS, value: "1"}    # reports calculated at once inside the site backend: 1 on the 512 MB free plan
      - {key: PRISM_SLOTS, value: "1"}                 # research API: calculations at once; must not exceed PREMIUM_GENERATION_SLOTS or the second one times out waiting
      - {key: STOCK_FUNDAMENTALS_CACHE_ENTRIES, value: "32"}   # provider data kept in memory (15 minutes each); bounds the site backend's memory
      - {key: SITE_API_START, value: auto}             # auto | never (keeps the site backend off) | always
      - {key: ALLOWED_HOSTS, value: "finlit-arug.onrender.com,localhost,127.0.0.1"}   # add your own domain here when you attach one; /api/ping and /api/health are exempt so Render's health check always passes
      - {key: CMS_JWT_SECRET, generateValue: true}   # signs the blog/CMS admin token; the research API and the site backend share it (same container)
      - {key: SECRET_KEY, generateValue: true}
      - {key: DEMO_PASSWORD, generateValue: true}
      - {key: ADMIN_EMAIL, sync: false}         # the real administrator; sign in at /login, then set up the authenticator app
      - {key: ADMIN_PASSWORD, sync: false}      # 10+ characters, not containing the email name; remove this variable after your first sign-in
      - {key: RESET_MFA_EMAIL, sync: false}     # only when an authenticator is lost or handed over: the account email; delete it after one restart
      - {key: ADMIN_REQUIRE_MFA, value: "0"}    # TEMPORARY, the founder switched the admin authenticator off until launch: set back to "1" before going live (administrators then need their authenticator code)
      - {key: SCORE_ALL_PER_RUN, value: "1500"}  # other listed companies scored each night (score row only); all ~5,800 are covered within a few nights
      - {key: INGEST_LIMIT, value: "500"}      # companies loaded in the background after each start (resumable)
      - {key: RATE_LIMIT_PER_MINUTE, value: "1200"}
      # Optional, add later in the Environment tab: GEMINI_API_KEY (FinLit AI chat), RESEND_API_KEY + SENDER_EMAIL +
      # CONTACT_RECIPIENT_EMAIL (contact and enquiry emails), UPSTOX_ACCESS_TOKEN (NIFTY ticker strip).
      # Dhan market data (docs/DHAN-SETUP.md): DHAN_CLIENT_ID + DHAN_PIN + DHAN_TOTP_SECRET (the server renews its own token daily),
      # or DHAN_CLIENT_ID + DHAN_ACCESS_TOKEN (pasted daily). Add them as secrets in the Environment tab, never in this file.
      - key: REDIS_URL
        fromService: {type: keyvalue, name: finlit-redis, property: connectionString}
  - type: keyvalue
    name: finlit-redis
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []          # reachable only from inside Render
